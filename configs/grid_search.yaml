# Optuna hyperparameter search + repeat-eval spec for scripts/grid_search.py.
#
# Two modes share this file:
#   search  -> runs an Optuna study that samples hyperparameters from `grid`
#              (each list is a categorical choice), trains each trial, records
#              validation-set performance to a leaderboard CSV, and writes
#              best_params.json.
#   eval    -> takes best_params.json (or --params PATH), runs the chosen config
#              `eval_runs` times, and writes each run's TEST-set result plus the
#              final mean/std to eval_results.json.
#
# Every training run gets a run name; its full effective config is saved under
# {output_dir}/{mode}/runs/{run_name}.json.
#
# Commands:
#   .\.venv\Scripts\python.exe scripts\grid_search.py search --config configs\grid_search.yaml
#   .\.venv\Scripts\python.exe scripts\grid_search.py eval   --config configs\grid_search.yaml
#   .\.venv\Scripts\python.exe scripts\grid_search.py search --config configs\grid_search.yaml --dry-run

# Base training config; every run starts from these defaults.
base_config: configs/experiment.yaml

# Metric read from run_training()'s metrics[split][target_metric].
# target_metric accepted: auc | acc | loss (auc/acc maximized, loss minimized
# unless you flip `maximize`).
target_metric: auc
validation_split: ood_val      # search ranks combinations by this split
test_split: ood_test           # eval reports / aggregates this split
maximize: true

# Both modes write under one parent directory:
#   {output_dir}/search/leaderboard.csv
#   {output_dir}/search/best_params.json
#   {output_dir}/eval/eval_results.json
output_dir: final_testing_outputs

# search mode (Optuna study)
# study_name identifies the persistent SQLite study saved at
# {output_dir}/search/study.db. Re-running `search` with the same name resumes
# it (only the remaining trials run); change the name (or delete study.db) to
# start a fresh study, e.g. after editing the `grid` search space.
study_name: parameter_search
n_trials: 100                   # number of Optuna trials (parameter combinations)
search_repeats: 3              # runs per trial (val metric averaged if >1)
sampler_seed: 7                # Optuna TPE sampler seed (reproducible study)
base_seed: 1                   # training run r uses training seed base_seed + r

# eval mode
eval_runs: 5                   # times to run the chosen config on the test split

# Params JSON eval reads the chosen config from. Leave empty to use the search
# output {output_dir}/search/best_params.json. The CLI --params flag overrides
# this. Relative paths are resolved from the directory you run the command in.
params_path:

# Fixed overrides applied to every run (search and eval). Keep runs light; the
# script already suppresses checkpoints/manifests/diagnostics regardless.
overrides:
  epochs: 40

# The search space. Each key -> a list of candidate values; Optuna samples one
# value per key per trial (trial.suggest_categorical). Unlike an exhaustive grid,
# `n_trials` controls how many combinations are actually trained, so you can widen
# these lists without paying for the full Cartesian product.
grid:
  lambda_contrast: [0.0, 0.1, 0.5, 1.0]
  lambda_diversity: [0.0, 2.0, 4.0, 8.0, 16.0]
  lambda_irm: [0.0, 2.0, 4.0, 8.0, 16.0]
  num_envs: [2, 4, 8]
  fragment_sample_ratio: [0.85, 0.9, 0.95]
  learning_rate: [0.001, 0.0005]
  dropout: [0.1, 0.2, 0.3]
 
  
