# Unified experiment config for the implemented preprocessing pipeline.
#
# Current smoke-test command:
#   .\.venv\Scripts\python.exe src\data\preprocess.py --config configs\experiment.yaml
#
# Optional loader check:
#   .\.venv\Scripts\python.exe src\data\preprocess.py --config configs\experiment.yaml --validate-loaders
#
# This one file can be used in two modes:
#
# 1. Smoke mode:
#    Keep the inline `splits:` block at the bottom. This runs without a
#    downloaded dataset and is useful for checking preprocessing, batching,
#    fragmentation, and reconstruction contracts.
#
# 2. Real dataset mode:
#    Remove or comment out the `splits:` block, then set `dataset`, `raw_path`,
#    `processed_dir`, and the record key names below. preprocess.py will read
#    .csv, .tsv, .json, or .jsonl records and group them by `split_key`.
#
# Keep `processed_dir` aligned with both the dataset and fragmentation method
# so outputs from different fragmenters do not overwrite each other.

# Dataset identifier stored in each processed .pt file's metadata.
#
# Smoke mode:
#   dataset: smoke
#
# Real dataset examples:
#   dataset: bbbp
#   dataset: drugood_ec50_scaffold
dataset: bbbp

# Representation/cache version.
# Bump this if atom features, bond features, fragmentation rules, pooling, or
# saved .pt structure change in a backward-incompatible way.
preprocess_version: "0.1.0"

# Fragmentation method.
# Available now:
#   group_graph: default Group Graph-style molecular fragments.
#   brics: RDKit BRICS fragments for ablation/comparison.
# Future:
#   recap: planned, not implemented yet.
fragmentation: group_graph

# Fragment/supernode feature construction.
# Available now:
#   mean_atom_and_internal_bond:
#     mean-pool raw atom features inside each fragment;
#     mean-pool raw internal-bond features inside each fragment;
#     append fragment size features.
pooling: mean_atom_and_internal_bond

# Fixed dimensions from the copied Group Graph encoders.
# Current fragment vectors are 149 dims: 133 atom + 14 bond + 2 size features.
atom_feature_dim: 133
bond_feature_dim: 14
fragment_feature_dim: 149

# Output directory for generated .pt files.
# preprocess.py will write:
#   data/processed/smoke/group_graph/train.pt
#   data/processed/smoke/group_graph/valid.pt
#   data/processed/smoke/group_graph/test.pt
#
# Examples:
#   processed_dir: data/processed/smoke/group_graph
#   processed_dir: data/processed/smoke/brics
#   processed_dir: data/processed/bbbp/group_graph
#   processed_dir: data/processed/bbbp/brics
processed_dir: data/processed/bbbp/group_graph

# When strict is false, skipped records are written here for inspection.
# If omitted, preprocess.py writes preprocess_failures.csv inside processed_dir.
failure_report_path: data/processed/bbbp/group_graph/preprocess_failures.csv

# Real dataset input path.
# Leave this commented in smoke mode because the inline `splits:` block below
# is the data source. In real dataset mode, uncomment and set this path.
#
# Supported file types:
#   .csv, .tsv, .json, .jsonl
#
raw_path: data/raw/bbbp/BBBP.csv

# Record key names used by process_record(). These must match either the inline
# records below or the real dataset file columns/keys.
smiles_key: smiles
label_key: p_np
split_key: split
environment_key: environment
molecule_id_key: num

# Used only when raw data has no split column. BBBP's common CSV format has
# columns num,name,p_np,smiles and no official split field, so preprocessing
# creates deterministic train/valid/test splits from these ratios.
split_ratios:
  train: 0.8
  valid: 0.1
  test: 0.1

# Error handling.
# Smoke tests can use true so failures are loud. Real datasets often contain
# a few invalid/unparseable SMILES, so false skips bad rows and reports counts.
strict: false

# Progress logging for preprocess.py.
# This is intentionally YAML-only; there is no CLI debug flag.
debug: true
debug_record_interval: 100
debug_molecule_details: false

# PyG DataLoader settings used by --validate-loaders.
# train loaders shuffle automatically; valid/test loaders do not.
batch_size: 16
num_workers: 0
pin_memory: false
drop_last: false
seed: 7

# PyG follow_batch fields.
# fragment_x_static creates fragment_x_static_batch after batching.
follow_batch:
  - fragment_x_static

# SuGAr model settings.
# These are used by train_sugar.py. The config file provides defaults; explicit
# CLI values override them for a single run.
num_classes: 2
gnn_layers: 3
hidden_dim: 128
edge_ratio: 0.5
num_views: 1
dropout: 0.1

# Training-time random fragment-edge sampler.
# 1.0 keeps the full fragment graph. Values below 1.0 enable SuGAr-style
# random fragment-edge dropping during training only.
fragment_sample_ratio: 1.0
sampler_seed: 7

# Optimizer and training loop settings.
learning_rate: 0.001
weight_decay: 0.0
epochs: 100
patience: 20
device: cuda
save_model:

# Auxiliary loss settings.
# Current trainer defaults are active, but expose them here so experiments are
# explicit and easy to override. For early debugging, set these to 0.0 one at a
# time. IRM is optional and should use real environments before OOD claims.
lambda_contrast: 1.0
lambda_diversity: 1.0
lambda_irm: 1.0
contrast_temperature: 0.5
contrast_sampling: mul

# Smoke-mode inline records grouped by split.
# For smoke mode, comment out raw_path above, set dataset/processed_dir back to
# smoke paths, and uncomment this block.
#
# splits:
#   train:
#     - molecule_id: smoke_ester
#       smiles: "CCOC(=O)C"
#       label: 1
#       environment: debug_train
#     - molecule_id: smoke_benzene
#       smiles: "c1ccccc1"
#       label: 0
#       environment: debug_train
#   valid:
#     - molecule_id: smoke_ethane
#       smiles: "CC"
#       label: 1
#       environment: debug_valid
#   test:
#     - molecule_id: smoke_helium
#       smiles: "[He]"
#       label: 0
#       environment: debug_test

# Future full-SuGAr options:
# aggregation: mean
# weight_averaging: false
# greedy_model_selection: false
