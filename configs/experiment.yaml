# Unified experiment config for preprocessing, FragmentCIGA training, and
# SuGAREnsemble evaluation.
#
# Preferred consolidated CLI commands:
#
#   Preprocess DrugOOD and validate batches:
#     .\.venv\Scripts\python.exe main.py preprocess --config configs\experiment.yaml --validate-loaders
#
#   Full configured run: preprocess, train, and save enabled outputs:
#     .\.venv\Scripts\python.exe main.py full --config configs\experiment.yaml --validate-loaders
#
#   Short end-to-end training smoke with checkpoint:
#     .\.venv\Scripts\python.exe main.py train --config configs\experiment.yaml --run-name smoke_cpu --epochs 1 --patience 1 --num-views 1 --hidden-dim 8 --gnn-layers 1 --batch-size 512 --device cpu --lambda-contrast 0 --lambda-diversity 0 --lambda-irm 0
#
#   Evaluate a saved checkpoint without training:
#     .\.venv\Scripts\python.exe main.py eval checkpoints\smoke.pt --config configs\experiment.yaml --splits ood_test iid_test --device cpu
#
#   Resume training from a saved checkpoint:
#     .\.venv\Scripts\python.exe main.py resume outputs\...\checkpoints\best_model.pt --config configs\experiment.yaml --epochs 1 --device cpu --run-name smoke_resumed
#
#   Run diagnostics through the consolidated CLI:
#     .\.venv\Scripts\python.exe main.py diagnostics fragments data\processed\drugood_lbap_core_ec50_assay\group_graph --splits train ood_val ood_test
#     .\.venv\Scripts\python.exe main.py diagnostics losses logs\sugar_training_losses.csv
#
# The original entrypoints still work for focused debugging:
#   .\.venv\Scripts\python.exe src\data\preprocess.py --config configs\experiment.yaml --validate-loaders
#   .\.venv\Scripts\python.exe train_sugar.py --config configs\experiment.yaml
#
# This one file can be used in two modes:
#
# 1. Smoke mode:
#    Comment out raw_path/raw_format, switch dataset/processed_dir to smoke
#    paths, set label_key/environment_key to match the inline records, and
#    uncomment the inline `splits:` block at the bottom. This runs without a
#    downloaded dataset and is useful for checking preprocessing/batching.
#
# 2. Real dataset mode, active below:
#    Keep `raw_path`/`raw_format`, set `dataset`, `processed_dir`, field keys,
#    and split roles. Native DrugOOD JSON preserves source split names.
#
#    Flat .csv/.tsv/.json/.jsonl records can be grouped by `split_key` or by
#    deterministic `split_ratios`.
#
#    Native DrugOOD JSON can be enabled by setting:
#      raw_format: drugood_json
#      raw_path: data/raw/drugood/lbap_core_ec50_assay.json
#      split_names: [train, iid_val, ood_val, iid_test, ood_test]
#
# `view_fragmentations` below is the source of truth for which fragment graph(s)
# are built and used. If `processed_dir` is empty, main.py derives it from
# `{processed_root}/{dataset}/{fragmentation_recipe}`.

# Consolidated run outputs.
# When output_root is set, training/full/preprocess commands write run artifacts
# under:
#
#   {output_root}/{dataset}/{fragmentation_recipe}/{run_name}/
#
# Use run_name: auto for a timestamped name such as:
#
#   drugood_lbap_core_ec50_assay__group_graph__train__20260708_120000
#   drugood_lbap_core_ec50_assay__mixed_group_graph5_brics3_recap2__train__20260708_120000
#
# Each run directory contains:
#
#   checkpoints/best_model.pt
#   training_epoch_losses.csv
#   final_evaluation_metrics.json
#   training_curves/
#   preprocessing_fragmentation_diagnostics/
#   subgraph_analysis/
#   config/effective_config.yaml
#   run_manifest.json
#
# Keep processed .pt files in data/processed/... because they are reusable
# dataset artifacts, not one-off run outputs.
output_root: outputs
run_name: auto

# Toggle which run artifacts are produced by `main.py full`. Run artifacts are
# written under output_root using the consolidated run directory layout above.
# Use CLI --no-* flags, such as --no-checkpoint or --no-training-curves, to
# suppress individual outputs for one run without editing this file.
save_outputs:
  checkpoint: true
  training_epoch_losses: true
  final_evaluation_metrics: true
  training_curves: true
  preprocessing_fragmentation_diagnostics: true
  subgraph_analysis: true
  effective_config: true
  run_manifest: true
  preprocess_failures: true

# Dataset identifier stored in each processed .pt file's metadata.
# Accepted: any non-empty string. Use stable, path-safe names because this is
# written into metadata and often used in report/checkpoint names.
#
# Smoke mode:
#   dataset: smoke
#
# Real dataset examples:
#   dataset: bbbp
#   dataset: drugood_lbap_core_ec50_assay
dataset: drugood_lbap_core_ec50_assay

# Representation/cache version.
# Bump this if atom features, bond features, fragmentation rules, pooling, or
# saved .pt structure change in a backward-incompatible way.
# Accepted: string. Recommended format: "major.minor.patch".
preprocess_version: "0.1.0"

# Fragmentation methods assigned to model views during preprocessing/training.
# Available now:
#   group_graph: default Group Graph-style molecular fragments.
#   brics: RDKit BRICS fragments for ablation/comparison.
#   recap: RECAP-rule bond cuts projected onto the original molecule, preserving
#     every atom for reconstruction/provenance.
#
# Counts must sum to num_views. Zero-count methods are allowed so you can switch
# recipes by changing counts without commenting keys in/out.
# Single positive-count method:
#   keeps the original lean unprefixed fragment fields in .pt files.
# Multiple positive-count methods:
#   stores method-prefixed fragment graph fields for each positive method.
view_fragmentations:
  group_graph: 6
  brics: 0
  recap: 0

# Fragment/supernode feature construction.
# Available now:
#   mean_atom_and_internal_bond:
#     mean-pool raw atom features inside each fragment;
#     mean-pool raw internal-bond features inside each fragment;
#     append fragment size features.
# Accepted: mean_atom_and_internal_bond.
pooling: mean_atom_and_internal_bond

# Fixed dimensions from the copied Group Graph encoders.
# Current fragment vectors are 149 dims: 133 atom + 14 bond + 2 size features.
# Accepted: positive integers. Do not change unless the featurizers/pooler
# change and preprocessed .pt files are regenerated.
atom_feature_dim: 133
bond_feature_dim: 14
fragment_feature_dim: 149

# Output directory for generated .pt files and training input.
# preprocess.py writes one `{split}.pt` file per selected split here.
# train_sugar.py later loads split files from this same directory.
#
# Examples:
#   processed_dir: data/processed/smoke/group_graph
#   processed_dir: data/processed/smoke/brics
#   processed_dir: data/processed/bbbp/group_graph
#   processed_dir: data/processed/bbbp/brics
#   processed_dir: data/processed/drugood_lbap_core_ec50_assay/group_graph
#   processed_dir: data/processed/drugood_lbap_core_ec50_assay/brics
#   processed_dir: data/processed/drugood_lbap_core_ec50_assay/recap
processed_root: data/processed
processed_dir:

# When strict is false, skipped records are written to preprocess_failures.csv
# inside processed_dir by default. Set failure_report_path only if you need a
# custom location.
# failure_report_path: data/processed/drugood_lbap_core_ec50_assay/group_graph/preprocess_failures.csv

# Real dataset input path. In smoke mode, comment raw_path/raw_format out
# because the inline `splits:` block is the data source.
#
# Supported file types:
#   .csv, .tsv, .json, .jsonl
#
# raw_format accepted: infer from extension when empty, or drugood_json for
# native DrugOOD split dictionaries.
raw_path: data/raw/drugood/lbap_core_ec50_assay.json
raw_format: drugood_json

# Record key names used by process_record().
# For this DrugOOD JSON:
#   smiles:     molecular SMILES string
#   cls_label:  binary classification label
#   domain_id:  DrugOOD domain/environment identifier
# Metadata keys are retained for provenance/debugging but are not model inputs.
smiles_key: smiles
label_key: cls_label
environment_key: domain_id
molecule_id_key:
generate_molecule_id: true
metadata_keys:
  - assay_id
  - reg_label
  - domain_id

# Used only when raw data has no native split dictionary or split column.
# DrugOOD provides native splits, so keep these commented while this config is
# in DrugOOD mode.
#
# split_key: split
# split_ratios:
#   train: 0.8
#   valid: 0.1
#   test: 0.1

# Split selection for preprocessing, loading, training, and reporting.
# For BBBP/random ratio splits, use train/valid/test or set loader_split_names
# if you only want to load a subset. For DrugOOD, preserve the native split
# names and use OOD validation/test for the main OOD protocol:
#
#   split_names: [train, iid_val, ood_val, iid_test, ood_test]
#   train_split: train
#   validation_split: ood_val
#   test_split: ood_test
#   report_splits: [iid_val, iid_test]
#
split_names:
  - train
  - iid_val
  - ood_val
  - iid_test
  - ood_test
train_split: train
validation_split: ood_val
test_split: ood_test
report_splits:
  - iid_val
  - iid_test

# Error handling.
# Smoke tests can use true so failures are loud. Real datasets often contain
# a few invalid/unparseable SMILES, so false skips bad rows and reports counts.
# Accepted: true | false.
strict: false

# Progress logging for preprocess.py.
# This is intentionally YAML-only; there is no CLI debug flag.
# debug accepted: true | false.
# debug_record_interval accepted: positive integer. Try 100-1000 for real data.
# debug_molecule_details accepted: true | false. Usually false for large runs.
debug: true
debug_record_interval: 250
debug_molecule_details: false

# PyG DataLoader settings used by --validate-loaders and train_sugar.py.
# The loader named by train_split shuffles automatically; all other splits do
# not. `seed` controls deterministic DataLoader shuffling/worker seeds, not the
# FragmentCIGA sampler seeds below.
# batch_size accepted: positive integer. Practical range: 32-512, depending on
# memory; 128 is a reasonable default.
# num_workers accepted: integer >= 0. Practical range on Windows: 0-4; use 0 if
# multiprocessing/data loading behaves strangely.
# pin_memory accepted: true | false. Most useful with CUDA.
# drop_last accepted: true | false. Usually false for molecular datasets.
# seed accepted: integer or empty/null.
batch_size: 128
num_workers: 4
pin_memory: true
drop_last: false
seed: 7

# PyG follow_batch fields.
# fragment_x_static creates fragment_x_static_batch after batching.
follow_batch:
  - fragment_x_static

# FragmentCIGA view settings.
# train_sugar.py/main.py builds `num_views` separate FragmentCIGA views from
# one shared initial state, then trains them with SuGARTrainer. After training,
# the views are wrapped in SuGAREnsemble for inference-time aggregation.
# Explicit CLI values override YAML defaults for a single run. When resuming or
# evaluating a checkpoint, architecture-defining fields such as num_views,
# gnn_layers, hidden_dim, edge_ratio, dropout, sampler_seed, and aggregation_mode
# come from the checkpoint so the saved weights can be reconstructed correctly.
# num_classes accepted: integer >= 2. Binary DrugOOD uses 2.
# gnn_layers accepted: positive integer. Practical range: 1-5; try 2-4.
# hidden_dim accepted: positive integer. Practical range: 32-256; try 64, 128, 256.
# edge_ratio accepted: float in (0, 1]. Practical range: 0.1-0.6; lower selects
# a smaller invariant subgraph.
# num_views accepted: positive integer. Practical range: 1-5 for local runs;
# larger costs more memory/time.
# Mixed-method ensembles aggregate fragment-edge scores only within compatible
# methods, then soft-vote predictions across method groups.
# dropout accepted: float in [0, 1). Practical range: 0.0-0.3.
num_classes: 2
gnn_layers: 3
hidden_dim: 128
edge_ratio: 0.5
num_views: 3
dropout: 0.1

# Training-time random fragment-edge sampler inside each FragmentCIGA view.
# 1.0 keeps the full fragment graph. Values below 1.0 enable SuGAr-style
# random fragment-edge dropping during training only. Evaluation mode keeps the
# full fragment graph. Each view gets sampler_seed + view_index so views start
# from shared weights but see different stochastic edge drops.
# fragment_sample_ratio accepted: float in (0, 1]. Practical range: 0.8-1.0;
# 1.0 disables training-time fragment-edge dropping.
# sampler_seed accepted: integer or empty/null.
fragment_sample_ratio: 0.95
sampler_seed: 7

# Optimizer and training loop settings.
# `device: cuda` automatically falls back to CPU when CUDA is unavailable.
# learning_rate accepted: positive float. Practical range: 1e-4 to 1e-3; try
# 0.001, 0.0005, 0.0001.
# weight_decay accepted: float >= 0. Practical range: 0 to 5e-4; try 0, 1e-5,
# 5e-4.
# epochs accepted: positive integer. Practical range: 1-5 for smoke, 20-100 for
# real experiments.
# patience accepted: positive integer. Practical range: 5-30; should usually be
# smaller than epochs.
# device accepted: cuda | cpu. cuda falls back to cpu if unavailable.
learning_rate: 0.001
weight_decay: 0.0005
epochs: 40
patience: 20
device: cuda

# The checkpoint, per-epoch loss CSV, and final evaluation metrics JSON are
# always placed in the consolidated output_root run directory when their
# save_outputs toggles are true:
#   checkpoints/best_model.pt
#   training_epoch_losses.csv
#   final_evaluation_metrics.json

# Trained-checkpoint subgraph analysis defaults.
# These are used by:
#   .\.venv\Scripts\python.exe main.py full --config configs\experiment.yaml
#   .\.venv\Scripts\python.exe main.py diagnostics subgraphs --config outputs\...\config\effective_config.yaml
#
# Leave subgraph_analysis_dir empty when output_root is active. The run
# directory will provide:
#   subgraph_analysis/
#
# subgraph_split defaults to test_split when empty.
# subgraph_num_samples empty/null analyzes the full selected split.
# subgraph_num_visualize accepted: integer >= 0. Use 0 to skip molecule PNGs.
# subgraph_metric_min_available filters interpretation tables by support.
# subgraph_metric_top_k accepted: integer; <=0 keeps all ranked rows.
subgraph_analysis_dir:
subgraph_split: ood_test
subgraph_num_samples:
subgraph_num_visualize: 10
subgraph_metric_min_available: 10
subgraph_metric_top_k: 25

# Auxiliary loss settings.
# Prediction-only baseline is active below: contrastive, diversity, and IRM
# weights are all zero. This is the clean control run for comparing whether
# SuGAr-style auxiliary objectives actually improve OOD validation/test AUC.
# Re-enable auxiliary losses in a separate run after this baseline is recorded.
#
# IRM only makes sense when a run has meaningful environment partitions. It is
# applied only when lambda_irm > 0.0 and num_envs > 1.
#
# env_split_key selects which per-example key assigns IRM environments. It is
# checked first against each example's `metadata` dict, then falls back to
# `environment_or_group` (the field populated by `environment_key` above,
# domain_id for this DrugOOD config). Unique key values are grouped into
# num_envs buckets as evenly as possible (e.g. 21 unique domains with
# num_envs: 2 gives group sizes 11/10); examples sharing a key value always
# land in the same environment. Set to null/"" to use a random split instead.
# lambda_contrast/lambda_diversity/lambda_irm accepted: float >= 0. Practical
# tuning ranges:
#   lambda_contrast: 0.0, 0.1, 0.5, 1.0
#   lambda_diversity: 0.0, 1.0, 2.0, 4.0
#   lambda_irm: 0.0, 0.1, 0.5, 1.0 after environment alignment is validated
# num_envs accepted: positive integer. Use 1 when IRM is disabled; try 2-5 for
# bucketed DrugOOD-domain IRM experiments.
# env_split_key accepted: metadata key string such as domain_id, or empty/null.
# env_bucket_strategy orders env_split_key domains before chunking them into
# num_envs buckets. `value` sorts by the raw key value (arbitrary). `size`
# sorts domains by per-domain mean molecule size (atom count) so environments
# span a size gradient. Accepted: value | size.
# contrast_temperature accepted: positive float. Practical range: 0.1-1.0.
# contrast_sampling accepted: mul | var | cnc.
lambda_contrast: 0.1
lambda_diversity: 4.0
lambda_irm: 4.0
num_envs: 4
env_split_key: domain_id
env_bucket_strategy: size
contrast_temperature: 0.1
contrast_sampling: mul

# When true and scikit-learn is installed, validation/model selection prefers
# ROC-AUC and falls back to accuracy if AUC is unavailable, such as a split with
# only one class.
# Accepted: true | false.
track_roc_auc: true

# Post-training ensemble behavior.
# aggregation_mode controls SuGAREnsemble inference: each trained view scores
# fragment edges, scores are aggregated by mean or max, one shared fragment
# subgraph is reconstructed, then classifiers soft-vote.
#
# greedy_model_selection evaluates view subsets on the validation split and
# keeps a view only if it improves validation AUC/accuracy. It is only
# meaningful when num_views > 1.
#
# Validation path: trainer validation now scores the ensemble through the same
# shared-subgraph aggregation (this aggregation_mode) + soft-vote path used at
# final test time. Best-epoch/early-stop selection restores a single joint
# snapshot of all views from the epoch with the best ensemble validation metric,
# and greedy_model_selection runs on that same SuGAREnsemble path — so training
# selection and final evaluation are consistent.
greedy_model_selection: true
aggregation_mode: mean

# Smoke-mode inline records grouped by split.
# For smoke mode, also set:
#   dataset: smoke
#   processed_dir: data/processed/smoke/group_graph
#   label_key: label
#   environment_key: environment
#   split_names: [train, valid, test]
#   validation_split: valid
#   test_split: test
#   report_splits: []
#
# splits:
#   train:
#     - molecule_id: smoke_ester
#       smiles: "CCOC(=O)C"
#       label: 1
#       environment: debug_train
#     - molecule_id: smoke_benzene
#       smiles: "c1ccccc1"
#       label: 0
#       environment: debug_train
#   valid:
#     - molecule_id: smoke_ethane
#       smiles: "CC"
#       label: 1
#       environment: debug_valid
#   test:
#     - molecule_id: smoke_helium
#       smiles: "[He]"
#       label: 0
#       environment: debug_test
# Full SuGAr-style weight averaging is not implemented in the active training
# path yet. Keep this disabled until src/models/weight_average.py is integrated
# with checkpointing and any required BN/stat recomputation.
# weight_averaging: false
